name: Build Android APK (Native)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      # FONDAMENTALE: dà i permessi di esecuzione a gradlew
      - name: Permessi di esecuzione per Gradle Wrapper
        working-directory: apps/android
        run: chmod +x gradlew

      - name: Build APK Debug con Gradle
        working-directory: apps/android
        run: ./gradlew assembleDebug

      - name: Carica APK tra gli Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: moto-hub-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
